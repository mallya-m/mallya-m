name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: mallya-m
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Commit snake
        run: |
          mkdir -p assets
          cp dist/snake-dark.svg assets/snake-dark.svg
          cp dist/snake-light.svg assets/snake-light.svg
          git config user.name "snake-bot"
          git config user.email "snake-bot@users.noreply.github.com"
          git add assets/snake-dark.svg assets/snake-light.svg
          git diff --cached --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push
